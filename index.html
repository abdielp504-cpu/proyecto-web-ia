<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador Rick and Morty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Explorador de Rick and Morty</h1>
    <p>Busca personajes, filtra resultados y guarda tus favoritos.</p>
    <button id="btn-tema" type="button">☀️ Modo claro</button>
  </header>

  <main>
    <!-- Buscador y filtros -->
    <section id="controles">
      <input type="text" id="buscador" placeholder="Buscar personaje por nombre...">

      <select id="filtro-estado">
        <option value="">Todos los estados</option>
        <option value="alive">Vivo</option>
        <option value="dead">Muerto</option>
        <option value="unknown">Desconocido</option>
      </select>

      <select id="filtro-genero">
        <option value="">Todos los géneros</option>
        <option value="female">Femenino</option>
        <option value="male">Masculino</option>
        <option value="genderless">Sin género</option>
        <option value="unknown">Desconocido</option>
      </select>

      <select id="filtro-especie">
        <option value="">Todas las especies</option>
        <option value="human">Humano</option>
        <option value="alien">Alien</option>
        <option value="humanoid">Humanoide</option>
        <option value="robot">Robot</option>
        <option value="animal">Animal</option>
        <option value="mythological">Criatura mitológica</option>
        <option value="cronenberg">Cronenberg</option>
        <option value="disease">Enfermedad</option>
        <option value="unknown">Desconocido</option>
      </select>

       <button id="btn-limpiar" type="button">Limpiar filtros</button>
    </section>

    <!-- Mensajes (sin resultados, errores, cargando) -->
    <p id="mensaje" class="oculto"></p>

    <!-- Resultados de la API -->
       <section>
      <h2>Personajes</h2>
      <p id="contador"></p>
      <div id="resultados" class="contenedor-tarjetas"></div>

      <div id="paginacion" class="oculto">
        <button id="btn-anterior" type="button">← Anterior</button>
        <span id="info-pagina"></span>
        <button id="btn-siguiente" type="button">Siguiente →</button>
      </div>
    </section>

    <!-- Favoritos -->
    <section>
      <h2>⭐ Mis favoritos</h2>
      <div id="favoritos" class="contenedor-tarjetas"></div>
    </section>
  </main>

  <footer>
    <p>Proyecto escolar · Datos de <a href="https://rickandmortyapi.com" target="_blank">Rick and Morty API</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
